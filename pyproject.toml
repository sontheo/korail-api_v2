[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "korail-api"
version = "0.1.0"
description = "Synchronous KORAIL protocol client"
requires-python = ">=3.11"
authors = [{name = "thsqaz123-dot"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
dependencies = ["httpx>=0.28.1", "cryptography>=50.0.2", "curl_cffi==0.16.3"]

[project.optional-dependencies]
socks = ["httpx[socks]>=0.28.1"]
dev = [
    "httpx[socks]>=0.28.1",
    "pytest>=8.3",
    "build>=1.2.2",
    "twine>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    "packaging>=24.2",
    "setuptools>=84.2.1",
]

[project.urls]
Repository = "https://github.com/thsqaz123-dot/korail-api_v2"
Issues = "https://github.com/thsqaz123-dot/korail-api_v2/issues"
Changelog = "https://github.com/thsqaz123-dot/korail-api_v2/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["korail_api*"]
namespaces = false

[tool.setuptools.package-data]
korail_api = ["resources/contracts/*.json", "resources/messages/*.json", "py.typed", "*.pyi", "**/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
norecursedirs = ["reference", "analysis", "build", "dist", "graft", "site", ".venv*", ".git"]

[tool.ruff]
target-version = "py311"
line-length = 112
src = ["src"]
extend-exclude = ["reference", "analysis", "build", "dist", ".venv*", "graft", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These modules install public declarations from the constructor contract.
"src/korail_api/models/records.py" = ["F821", "E402"]
"src/korail_api/__init__.py" = ["F401", "F821"]
"src/korail_api/**/*.pyi" = ["F401", "F403", "F405"]

[tool.mypy]
files = ["tests/typing_consumer.py"]
mypy_path = "src"
strict = true
follow_imports = "silent"

[tool.setuptools.data-files]
"share/doc/korail-api" = ["README.md", "LEGAL.md", "PROVENANCE.md", "VALIDATION.md", "ARCHITECTURE.md", "CHANGELOG.md", "THIRD_PARTY_NOTICES.md"]
