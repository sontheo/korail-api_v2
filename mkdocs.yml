site_name: korail-api
site_url: https://thsqaz123-dot.github.io/korail-api_v2/
site_description: Unofficial synchronous KORAIL Python client
repo_url: https://github.com/thsqaz123-dot/korail-api_v2
repo_name: thsqaz123-dot/korail-api_v2
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  font: false
plugins:
  - search
exclude_docs: |
  requirements.txt
validation:
  links:
    anchors: warn
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
nav:
  - Overview: index.md
  - Installation and usage: getting-started.md
  - Architecture: ARCHITECTURE.md
  - Validation: VALIDATION.md
  - Provenance: PROVENANCE.md
  - Legal notice: LEGAL.md
  - Third-party notices: THIRD_PARTY_NOTICES.md
