name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        dependencies: [current]
        include:
          - python: '3.11'
            dependencies: minimum
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install current root package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install exact declared runtime and build lower bounds
        if: matrix.dependencies == 'minimum'
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib
          from packaging.requirements import Requirement

          config = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          pins = []
          for text in config['project']['dependencies'] + config['build-system']['requires']:
              requirement = Requirement(text)
              bound, = requirement.specifier
              assert bound.operator in ('>=', '==')
              pins.append(f'{requirement.name}=={bound.version}')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *pins])
          PY
      - name: Check installed dependencies
        run: python -m pip check
      - name: Lint and format current code and tools
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Check public typing consumer
        run: python -m mypy
      - name: Standalone offline contracts
        run: python -m pytest
      - name: Recorded decoder equivalence
        run: python tools/validation/check_decoder_equivalence.py
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Verify metadata and isolated release artifacts
        run: |
          python -m twine check dist/*
          python tools/packaging/check_artifacts.py dist/*.whl --sdist dist/*.tar.gz

  docs:
    name: Current documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation tooling
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation with warnings treated as errors
        run: python -m mkdocs build --strict
