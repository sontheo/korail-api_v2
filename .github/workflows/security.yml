name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan tracked history with redacted output
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner \
            --log-opts="--all --full-history --diff-merges=first-parent" \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json"
      - name: Show finding locations without secret values
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gitleaks.json'
          if report.is_file():
              for item in json.loads(report.read_text()):
                  print(json.dumps({key: item[key] for key in ('RuleID', 'File', 'StartLine', 'Fingerprint')}))
          PY

  dependencies:
    name: Dependency audit (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dependencies: [current, minimum]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -r .github/requirements-security.txt
      - name: Extract declared runtime and build requirements without importing the SDK
        env:
          DEPENDENCY_SET: ${{ matrix.dependencies }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          from packaging.requirements import Requirement

          config = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          requirements = config['project']['dependencies'] + config['build-system']['requires']
          if os.environ['DEPENDENCY_SET'] == 'minimum':
              pinned = []
              for text in requirements:
                  requirement = Requirement(text)
                  bound, = requirement.specifier
                  assert bound.operator in ('>=', '==')
                  pinned.append(f'{requirement.name}=={bound.version}')
              requirements = pinned
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit-requirements.txt'
          target.write_text('\n'.join(requirements) + '\n')
          PY
      - name: Audit declared dependencies and their resolution
        run: python -m pip_audit --strict --progress-spinner=off -r "$RUNNER_TEMP/audit-requirements.txt"

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:python
